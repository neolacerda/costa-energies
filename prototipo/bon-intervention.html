<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="robots" content="noindex">
<title>Ordens de serviço — Costa Energies (protótipo)</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/MYv4RIr.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F97316;--oh:#EA6A0A;--oc:#FFF0E6;--of:#B8470A;
  --noir:#080808;--noir2:#141414;--fond:#F6F5F2;--carte:#FFFFFF;
  --txt:#1B1B1F;--txt2:#5C5C66;--trait:#E2E0DB;
  --ok:#0F7A4B;--okc:#E6F5EE;--ko:#B91C1C;--koc:#FDECEC;--warn:#8A5A00;--warnc:#FFF4DC;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--txt);background:var(--noir);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;line-height:1.2;letter-spacing:-.2px;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;}
:focus-visible{outline:3px solid var(--o);outline-offset:2px;}
[tabindex="-1"]:focus{outline:none;}

#app{max-width:480px;min-height:100dvh;margin:0 auto;background:var(--fond);display:flex;flex-direction:column;}
#app.large{max-width:820px;}
main{flex:1;padding:18px 16px 24px;}

/* En-tête */
.top{background:var(--noir);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top));}
.logo{height:44px;width:auto;display:block;}
.logotxt{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;color:#fff;}
.logotxt span{color:var(--o);}
.top-t{margin-left:auto;font-size:12px;color:rgba(255,255,255,.6);text-align:right;line-height:1.3;}
.demo{background:var(--oc);color:var(--of);font-size:12.5px;font-weight:700;text-align:center;padding:7px 12px;}

/* Boutons */
.btn{min-height:50px;padding:12px 20px;border-radius:10px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,border-color .18s,transform .18s;}
.btn:active{transform:scale(.98);}
.btn-p{background:var(--o);color:#111;}
.btn-p:hover{background:var(--oh);}
.btn-s{background:var(--carte);color:var(--txt);border:1.5px solid var(--trait);}
.btn-s:hover{border-color:var(--txt2);}
.btn-full{width:100%;}
.lien{color:var(--of);font-weight:700;font-size:14px;min-height:44px;padding:8px 2px;}
.lien:hover{color:var(--o);}

/* Accueil */
.hello{font-size:22px;font-weight:800;margin-bottom:2px;}
.sub{color:var(--txt2);font-size:14.5px;margin-bottom:16px;}
.titre-s{font-size:15px;font-weight:700;margin:26px 0 10px;}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;}
.ligne{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--carte);border:1px solid var(--trait);border-radius:12px;margin-bottom:8px;min-height:64px;transition:border-color .18s;}
.ligne:hover{border-color:var(--o);}
.heure{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;min-width:50px;color:var(--of);}
.l-c{flex:1;min-width:0;}
.l-t{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere;}
.l-s{display:block;color:var(--txt2);font-size:13.5px;overflow-wrap:anywhere;}
.fleche{color:var(--txt2);font-size:20px;flex-shrink:0;}
.pastille{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.p-ok{background:var(--okc);color:var(--ok);}
.p-warn{background:var(--warnc);color:var(--warn);}
.p-ko{background:var(--koc);color:var(--ko);}
.reprendre{display:flex;align-items:center;gap:10px;background:var(--warnc);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;color:var(--warn);}
.reprendre button{margin-left:auto;font-weight:700;color:var(--warn);text-decoration:underline;min-height:44px;padding:0 4px;}
.vide{color:var(--txt2);font-size:14px;padding:12px 2px;}
.pied{margin-top:22px;text-align:center;}

/* Formulaire */
.etapes{background:var(--noir);color:#fff;padding:0 16px 14px;}
.etapes-l{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.65);margin-bottom:7px;}
.barre{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.barre i{height:4px;border-radius:4px;background:rgba(255,255,255,.18);}
.barre i.on{background:var(--o);}
h1.h-e{font-size:21px;font-weight:800;margin-bottom:4px;}
.champ{margin-top:15px;}
.champ>label,.leg{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px;}
.req{color:var(--of);}
.aide{font-size:13px;color:var(--txt2);margin-top:4px;}
input,select,textarea{width:100%;min-height:50px;padding:12px 13px;background:var(--carte);border:1.5px solid var(--trait);border-radius:10px;font-size:16px;}
textarea{min-height:104px;resize:vertical;line-height:1.45;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(249,115,22,.2);}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.calc{margin-top:12px;background:var(--oc);border-radius:10px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--of);}
.calc b{font-family:'Sora',sans-serif;font-size:16px;}
.err{margin-top:14px;background:var(--koc);color:var(--ko);border-radius:10px;padding:10px 13px;font-size:14px;font-weight:700;}
.err:empty{display:none;}

/* Pièces */
.piece{display:grid;grid-template-columns:1fr 66px 44px;gap:6px;margin-bottom:6px;}
.piece input{min-width:0;}
.suppr{min-height:50px;border-radius:10px;color:var(--ko);font-size:22px;line-height:1;}
.suppr:hover{background:var(--koc);}

/* Mesures */
.mes{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px;margin-top:10px;}
.mes-t{font-weight:700;font-size:14.5px;margin-bottom:8px;}
.mes-v{position:relative;margin-bottom:8px;}
.mes-v input{padding-right:48px;}
.mes-v span{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--txt2);font-size:14px;pointer-events:none;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.seg button{min-height:44px;border:1.5px solid var(--trait);border-radius:9px;background:var(--fond);font-size:13.5px;font-weight:700;color:var(--txt2);padding:4px;}
.seg button[aria-pressed="true"].c{background:var(--okc);border-color:var(--ok);color:var(--ok);}
.seg button[aria-pressed="true"].n{background:var(--koc);border-color:var(--ko);color:var(--ko);}
.seg button[aria-pressed="true"].a{background:#E9E8E4;border-color:var(--txt2);color:var(--txt);}
.choix{display:grid;gap:7px;}
.choix button{min-height:52px;text-align:left;padding:10px 14px;border:1.5px solid var(--trait);border-radius:10px;background:var(--carte);font-weight:700;font-size:15px;}
.choix button[aria-pressed="true"]{border-color:var(--o);background:var(--oc);color:var(--of);}

/* Photos */
.ph-btn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.ph-grille{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.ph{position:relative;border-radius:10px;overflow:hidden;background:#ddd;aspect-ratio:4/3;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.ph em{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font-style:normal;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;}
.ph button{position:absolute;right:4px;top:4px;width:36px;height:36px;border-radius:9px;background:rgba(0,0,0,.72);color:#fff;font-size:18px;}

/* Signature */
.resume{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px;}
.resume div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;}
.resume span{color:var(--txt2);flex-shrink:0;}
.resume b{text-align:right;overflow-wrap:anywhere;min-width:0;}
.sig{display:block;width:100%;height:150px;background:var(--carte);border:1.5px dashed var(--txt2);border-radius:10px;touch-action:none;}
.sig-a{display:flex;justify-content:space-between;align-items:center;}

/* Équipe, pendências et profil */
.perfil{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.perfil label{font-size:13.5px;font-weight:700;white-space:nowrap;}
.perfil select{min-height:44px;padding:8px 12px;font-size:15px;}
.eq-h{display:flex;justify-content:space-between;align-items:center;}
.eq-h .mes-t{margin-bottom:6px;}
.mes .champ{margin-top:9px;}
.lien-ko{color:var(--ko);}
.totais{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;background:var(--oc);border-radius:10px;padding:10px 12px;color:var(--of);}
.totais span{display:block;font-size:12.5px;}
.totais b{font-family:'Sora',sans-serif;font-size:16px;}
.compte{display:inline-block;background:var(--o);color:#111;font-size:12px;font-weight:700;padding:0 8px;border-radius:20px;margin-left:4px;}
.pend{background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--o);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.pend-t{font-size:14px;margin-top:6px;overflow-wrap:anywhere;}
.pend-a{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap;}
.btn-mini{min-height:44px;padding:8px 14px;font-size:14px;}
.ph-leg{margin-top:6px;min-height:44px;padding:8px 11px;font-size:15px;}
.lang{grid-template-columns:1fr 1fr;margin-bottom:12px;}
.lang button[aria-pressed="true"].c{background:var(--oc);border-color:var(--o);color:var(--of);}
.t-tot td{font-weight:700;}
.d-inst{font-size:12.5px;color:var(--txt2);margin-top:6px;overflow-wrap:anywhere;}

/* Barre du bas */
.bas{position:sticky;bottom:0;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--fond);border-top:1px solid var(--trait);}
.bas.un{grid-template-columns:1fr;}

/* Bon (document) */
.doc-actions{display:grid;gap:8px;margin-bottom:16px;}
.ok-msg{background:var(--okc);color:var(--ok);border-radius:10px;padding:11px 14px;font-weight:700;font-size:14.5px;margin-bottom:12px;}
.doc{background:#fff;border:1px solid var(--trait);border-radius:12px;overflow:hidden;font-size:14px;}
.d-head{background:var(--noir);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.d-head .logo{height:36px;}
.d-num{text-align:right;}
.d-num strong{display:block;font-family:'Sora',sans-serif;font-size:15px;color:var(--o);}
.d-num span{font-size:12.5px;color:rgba(255,255,255,.7);}
.d-body{padding:6px 20px 16px;}
.d-sec{padding:13px 0;border-bottom:1px solid var(--trait);}
.d-sec:last-child{border-bottom:0;}
.d-sec h2{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--of);margin-bottom:7px;}
.d-info{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;}
.d-info span{display:block;color:var(--txt2);font-size:12.5px;}
.d-info b{overflow-wrap:anywhere;}
.d-txt{white-space:pre-wrap;overflow-wrap:anywhere;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:12.5px;color:var(--txt2);font-weight:500;padding:0 8px 5px 0;}
td{padding:6px 8px 6px 0;border-top:1px solid var(--trait);vertical-align:top;overflow-wrap:anywhere;}
th:last-child,td:last-child{padding-right:0;text-align:right;}
.d-ph{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.d-ph figure{break-inside:avoid;}
.d-ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;}
.d-ph figcaption{font-size:12px;color:var(--txt2);margin-top:2px;}
.d-sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.d-sign img{height:70px;max-width:100%;display:block;margin-top:4px;}
.d-sign small{display:block;color:var(--txt2);font-size:12.5px;}
.d-foot{background:var(--fond);padding:11px 20px;font-size:11.5px;color:var(--txt2);text-align:center;line-height:1.5;}
.d-demo{color:var(--of);font-weight:700;}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--noir2);color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;max-width:calc(100% - 32px);z-index:50;}

@media(min-width:560px){
  #app{box-shadow:0 0 0 1px rgba(255,255,255,.08);}
  .doc-actions{grid-template-columns:1fr 1fr;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
@media print{
  @page{size:A4;margin:11mm;}
  html,body{background:#fff;}
  .no-print{display:none!important;}
  #app,#app.large{max-width:none;min-height:0;background:#fff;box-shadow:none;display:block;}
  main{padding:0;}
  .doc{border:0;border-radius:0;font-size:10.5pt;overflow:visible;}
  .d-head,.d-foot{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .d-sec{break-inside:avoid;padding:9px 0;}
  .d-body{padding:2px 20px 6px;}
  .d-ph{grid-template-columns:repeat(4,1fr);}
  .d-ph img{aspect-ratio:3/2;}
  .d-info{gap:5px 18px;}
  td{padding:3px 8px 3px 0;}
  .d-sign img{height:50px;}
  .d-foot{break-inside:avoid;padding:7px 20px;}
}
</style>
</head>

/* Signature */
function initSignature(id){
  const c=$('#'+id),cle=SIGNATURES[id];if(!c)return;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';
  if(d[cle]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=d[cle];}
  let actif=false;
  const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);actif=true;x.beginPath();x.moveTo(...pos(e));x.lineTo(...pos(e));x.stroke();};
  c.onpointermove=e=>{if(!actif)return;x.lineTo(...pos(e));x.stroke();};
  c.onpointerup=c.onpointercancel=()=>{if(!actif)return;actif=false;d[cle]=c.toDataURL('image/png');sauverBrouillon();};
}
/* Photos */
function ajouterPhoto(fichier,t){
  const url=URL.createObjectURL(fichier),im=new Image();
  im.onload=()=>{
    const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    d.photos.push({t,leg:'',src:c.toDataURL('image/jpeg',.72)});
    sauverBrouillon();aller(vue,true);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Não foi possível ler esta imagem.');};
  im.src=url;
}

        <section class="d-sec"><div class="d-info">
          ${info(L.client,c.nom)}${info(L.site,c.site)}${info(L.machine,b.machine)}${info(L.type,typeDe(b.type)[langueDoc])}
          ${info(L.date,dateLoc(b.date,L.locale))}${info(L.etat,etatDe(b.etat)[langueDoc])}${info(L.commande,b.pedido)}${info(L.arret,arret)}${info(L.suite,orig&&orig.numero)}
        </div></section>
        ${sec(L.equipe,`<table class="t-eq"><tr><th>${L.tech}</th><th>${L.arrivee}</th><th>${L.depart}</th><th>${L.surSite}</th><th>${L.trajet}</th></tr>
          ${b.equipe.map(e=>`<tr><td>${esc(e.tech)}</td><td>${esc(e.arrivee)}</td><td>${esc(e.depart)}</td><td>${heures(minutes(e.arrivee,e.depart))}</td><td>${heures(parseInt(e.trajet,10)||0)}</td></tr>`).join('')}
          <tr class="t-tot"><td colspan="3">${L.total} : ${heures(t.total)}</td><td>${heures(t.site)}</td><td>${heures(t.trajet)}</td></tr></table>`)}
        ${sec(L.constat,b.constat?`<p class="d-txt">${esc(b.constat)}</p>`:'')}
        ${sec(L.travaux,`<p class="d-txt">${esc(b.travaux)}</p>`)}
        ${sec(L.pieces,b.pieces.length?`<table><tr><th>${L.design}</th><th>${L.qte}</th></tr>${b.pieces.map(p=>`<tr><td>${esc(p.nom)}</td><td>${esc(p.qte)}</td></tr>`).join('')}</table>`:'')}
        ${sec(L.mesures,mes.length?`<table><tr><th>${L.controle}</th><th>${L.valeur}</th><th>${L.resultat}</th></tr>${mes.map(m=>`<tr><td>${esc(m[langueDoc])}</td><td>${m.v?esc(m.v)+' '+esc(m.unite):'—'}</td><td>${m.s?RESULTATS[m.s][langueDoc]:'—'}</td></tr>`).join('')}</table>${b.instrument?`<p class="d-inst">${L.instrument} : ${esc(b.instrument)}</p>`:''}`:'')}
        ${sec(L.photos,b.photos.length?`<div class="d-ph">${b.photos.map((p,i)=>`<figure><img src="${esc(p.src)}" alt="${esc(PHOTOS[p.t][langueDoc])} ${i+1}"><figcaption>${esc(PHOTOS[p.t][langueDoc])}${p.leg?' · '+esc(p.leg):''}</figcaption></figure>`).join('')}</div>`:'')}
        ${sec(L.reserves,b.reserves?`<p class="d-txt">${esc(b.reserves)}</p>`:'')}
        ${sec(L.suivi,b.pendencia?`<p class="d-txt">${esc(b.pendencia)}</p>`:'')}
        <section class="d-sec"><h2>${L.signatures}</h2><div class="d-sign">
          <div><small>${L.pour} ${esc(ENTREPRISE.nom)}</small><b>${esc(b.equipe[0].tech)}</b>
            ${b.sigTech?`<img src="${esc(b.sigTech)}" alt="${L.signatures} ${esc(b.equipe[0].tech)}">`:`<small>${L.exemple}</small>`}
          </div>
          <div><small>${L.pourClient}</small><b>${esc(b.signataire)}</b>
            ${b.signature?`<img src="${esc(b.signature)}" alt="${L.signatures} ${esc(b.signataire)}"><small>${L.signeLe} ${esc(new Date(b.signeLe).toLocaleString(L.locale,{dateStyle:'short',timeStyle:'short'}))}</small>`:`<small>${L.exemple}</small>`}
          </div>
        </div></section>
      </div>
      <footer class="d-foot">
        ${esc(ENTREPRISE.nom)} · ${esc(ENTREPRISE.forme)} · SIRET ${esc(ENTREPRISE.siret)}<br>${esc(ENTREPRISE.adresse)} · ${esc(ENTREPRISE.tel)}<br>
        <span class="d-demo">${L.demo}</span>
      </footer>
    </article>
  </main>`;
}

/* ---------- Rendu ---------- */
function render(){
  const a=$('#app');
  a.classList.toggle('large',vue.nom==='bon');
  if(vue.nom==='accueil')a.innerHTML=vueAccueil();
  else if(vue.nom==='etape'){a.innerHTML=vueEtape(vue.n);if(vue.n===4){initSignature('sig-t');initSignature('sig-c');}}
  else a.innerHTML=vueBon(vue.id,vue.neuf);
}

let photoType='av';
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,i=+t.dataset.i;
  if(a==='nouveau'){d=nouveauBon();sauverBrouillon();aller({nom:'etape',n:0});}
  else if(a==='planifie'){const p=PLANNING[i];d=nouveauBon({client:p.client,machine:p.machine,type:p.type});sauverBrouillon();aller({nom:'etape',n:0});}
  else if(a==='reprendre'){d=lire(CLES.brouillon,null);if(d)aller({nom:'etape',n:0});}
  else if(a==='voir')aller({nom:'bon',id:t.dataset.id});
  else if(a==='accueil')aller({nom:'accueil'});
  else if(a==='pend-retorno'){const b=tousLesBons().find(x=>x.id===t.dataset.id);d=nouveauBon({client:b.client,machine:b.machine,type:'cur',origem:b.id});sauverBrouillon();aller({nom:'etape',n:0});}
  else if(a==='pend-resolver'){resolues[t.dataset.id]='manuel';ecrire(CLES.resolues,resolues);aller(vue,true);toast('Pendência marcada como resolvida.');}
  else if(a==='lang'){langueDoc=t.dataset.l;aller(vue,true);}
  else if(a==='reset'){if(confirm('Apagar as ordens, as pendências resolvidas e o rascunho desta demonstração?')){effacer(CLES.bons);effacer(CLES.brouillon);effacer(CLES.resolues);bons=[];resolues={};d=null;aller({nom:'accueil'});}}
  else if(a==='retour'){if(vue.n)aller({nom:'etape',n:vue.n-1});else aller({nom:'accueil'});}
  else if(a==='suite'){
    const err=erreurEtape(vue.n);
    if(err){$('#err').textContent=err[1];if(err[0])$('#'+err[0])?.focus();else $('#err').scrollIntoView({block:'center'});return;}
    if(vue.n<4)aller({nom:'etape',n:vue.n+1});else valider();
  }
  else if(a==='ajout-tech'){d.equipe.push(ligneEquipe(TECHS.find(x=>!d.equipe.some(e=>e.tech===x))||TECHS[0]));sauverBrouillon();aller(vue,true);}
  else if(a==='suppr-tech'){d.equipe.splice(i,1);sauverBrouillon();aller(vue,true);}
  else if(a==='ajout-piece'){d.pieces.push({nom:'',qte:'1'});sauverBrouillon();aller(vue,true);}
  else if(a==='suppr-piece'){d.pieces.splice(i,1);if(!d.pieces.length)d.pieces.push({nom:'',qte:'1'});sauverBrouillon();aller(vue,true);}
  else if(a==='mesure'){const r=d.mesures[i];r.s=r.s===t.dataset.s?'':t.dataset.s;sauverBrouillon();aller(vue,true);}
  else if(a==='etat'){d.etat=ETATS[i].id;sauverBrouillon();aller(vue,true);}
  else if(a==='photo'){photoType=t.dataset.t;$('#fichier').click();}
  else if(a==='suppr-photo'){d.photos.splice(i,1);sauverBrouillon();aller(vue,true);}
  else if(a==='eff-sig'){d[SIGNATURES[t.dataset.c]]='';const c=$('#'+t.dataset.c);c.getContext('2d').clearRect(0,0,c.width,c.height);sauverBrouillon();}
  else if(a==='pdf'){
    const b=tousLesBons().find(x=>x.id===vue.id),titre=document.title;
    document.title=b.numero+' - '+b.machine;
    window.addEventListener('afterprint',()=>{document.title=titre;},{once:true});
    window.print();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='rech'){$('#hist').innerHTML=listeHist(t.value);return;}
  if(t.id==='usuario'){usuario=t.value;ecrire(CLES.usuario,usuario);aller(vue,true);return;}
  if(!d)return;
  if(t.dataset.f){
    d[t.dataset.f]=t.value;
    if(t.dataset.f==='client'){d.machine='';aller(vue,true);}
    if(t.dataset.f==='arretIni'||t.dataset.f==='arretFim')$('#t-arret').textContent=texteArret();
  }else if(t.dataset.e!==undefined){d.equipe[+t.dataset.e][t.dataset.k]=t.value;afficherTotaux();}
  else if(t.dataset.p!==undefined)d.pieces[+t.dataset.p][t.dataset.k]=t.value;
  else if(t.dataset.m!==undefined)d.mesures[+t.dataset.m].v=t.value;
  else if(t.dataset.ph!==undefined)d.photos[+t.dataset.ph].leg=t.value;
  sauverBrouillon();
});
document.addEventListener('change',e=>{
  if(e.target.id==='fichier'&&e.target.files[0])ajouterPhoto(e.target.files[0],photoType);
});

render();
</script>
</body>
</html>
